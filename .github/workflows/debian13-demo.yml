name: Debian 13 demo

on:
  pull_request:
    paths:
      - "debian13/**"
      - ".github/workflows/debian13-demo.yml"
  push:
    branches: [main]
    paths:
      - "debian13/**"
      - ".github/workflows/debian13-demo.yml"

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and contract tests
        run: python -m unittest discover -s debian13/tests -v
      - name: Loopback API smoke test
        run: python debian13/smoke_test.py
