name: Debian 13 validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.devcontainer/debian13/**'
      - '.github/workflows/debian13-validation.yml'
      - 'docs/DEBIAN13_AGENT_SETUP.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Debian release and configuration
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "13"
          apt-get update
          apt-get install -y --no-install-recommends python3
          python3 -m json.tool .devcontainer/debian13/devcontainer.json >/dev/null
          echo "Debian 13 configuration verified"
