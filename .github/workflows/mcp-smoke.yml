name: MCP security and protocol smoke
on:
  pull_request:
    paths:
      - 'server.ts'
      - 'integrations/mcp/**'
      - 'tests/mcp-security.test.mjs'
      - '.github/workflows/mcp-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: MCP authentication and protocol regression
        run: node --test tests/mcp-security.test.mjs
